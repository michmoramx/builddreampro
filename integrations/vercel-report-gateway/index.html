<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build Dreams · Reporte de prueba</title><style>body{font:16px system-ui;color:#152e3b;background:#f5f8f7;margin:0}main{max-width:960px;margin:60px auto;padding:24px}small{color:#58736e}h1{font-size:34px}button,a{display:inline-block;border:0;background:#16333f;color:white;border-radius:8px;padding:12px 18px;text-decoration:none;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:24px 0}.card,section{background:white;padding:22px;border:1px solid #dae8e1;border-radius:12px}.card strong{display:block;font-size:32px;margin-top:8px}li{margin:10px 0}p{line-height:1.6}a{background:#daeee3;color:#16333f}</style></head><body><main><small>BUILD DREAMS MM · ACCESO PRIVADO DE PRUEBA</small><h1>Prioridades de la compañía</h1><p>Consulta los datos registrados en el centro privado. Actualiza el reporte después de guardar cambios.</p><button id="refresh">Actualizar reporte</button> <a href="https://build-dreams-ops-mich.michmoramx.chatgpt.site">Abrir centro operativo</a><p id="state" role="status">Este reporte requiere acceso autorizado y un despliegue privado de prueba.</p><div id="counts" class="cards"></div><section><h2>Tareas abiertas</h2><ul id="tasks"></ul></section></main><script>async function load(){const s=document.querySelector('#state'),c=document.querySelector('#counts'),t=document.querySelector('#tasks');c.replaceChildren();t.replaceChildren();s.textContent='Consultando…';try{const r=await fetch('/api/company-report',{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'No se pudo consultar el reporte.');s.textContent='Fecha del reporte: '+d.date+' · '+d.timezone;for(const [label,key]of[['Tareas abiertas','openTasks'],['Tareas vencidas','overdueTasks'],['Seguimientos','openFollowUps'],['Obras','projects']]){const a=document.createElement('div');a.className='card';const b=document.createElement('strong');a.append(document.createTextNode(label));b.textContent=String(d.counts?.[key]??0);a.append(b);c.append(a);}for(const row of d.tasks||[]){const li=document.createElement('li');li.textContent=row.title+' · '+row.owner+' · '+row.due;t.append(li);}if(!d.tasks?.length){const li=document.createElement('li');li.textContent='No hay tareas abiertas registradas.';t.append(li);}}catch(e){s.textContent=e.message;}}document.querySelector('#refresh').addEventListener('click',load);</script></body></html>
